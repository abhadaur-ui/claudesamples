<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign in</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <div class="field">
        <input type="email" id="email" name="email" placeholder="your@email.com" required />
      </div>

      <div class="row">
        <label for="password">Password</label>
        <a href="#" class="link-inline">Forgot your password?</a>
      </div>
      <div class="field">
        <input type="password" id="password" name="password" required />
      </div>

      <button type="submit" id="submit-btn">Sign in</button>

      <p id="error-message" class="error" hidden>Login failed. Please check your email and password.</p>
    </form>

    <p class="signup-line">Don't have an account? <a href="#">Sign up</a></p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
